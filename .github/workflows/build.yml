name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Vellum-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK for in-app update
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Vellum.apk
          echo "$GITHUB_SHA" > version.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: vellum-latest
          name: Vellum (последняя сборка)
          files: |
            Vellum.apk
            version.txt
          overwrite_files: true
          prerelease: true

      - name: Dump libbox API (diagnostics)
        if: always()
        run: |
          AAR=$(find ~/.gradle -name "libbox*.aar" | head -1)
          mkdir -p /tmp/lb && cd /tmp/lb && unzip -o -q "$AAR"
          echo "===== setup-related Libbox methods"
          javap -cp classes.jar io.nekohasekai.libbox.Libbox | grep -iE "setup|basePath|workingPath|directory" || true
          for c in SetupOptions; do echo "===== $c"; javap -cp classes.jar "io.nekohasekai.libbox.$c" || true; done
